name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs the toolchain (and rustfmt/clippy) pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Unit, integration and doc tests.
      - run: cargo test --workspace --all-features --locked
      # Broken intra-doc links and links to private items.
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # colab's own packs (colab.toml): their cases, then the tree itself.
      - run: cargo run -q -p colab-cli --locked -- test
      - run: cargo run -q -p colab-cli --locked -- fix --check
      # Links inside docs/ resolve, anchors included (exit 10 if not).
      - run: cargo run -q -p colab-cli --locked -- links docs
      # The notices `colab licenses` prints match Cargo.lock.
      - run: scripts/third-party-licenses.py --check

  windows:
    name: windows — the release builds there
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p colab-cli --locked
      # The engine end to end: colab's own pack against its cases.
      - run: cargo run -q -p colab-cli --locked -- test

  msrv:
    name: msrv — rust-version is the toolchain we build with
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rust-version and rust-toolchain.toml agree
        id: floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 -E '^rust-version *=' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 -E '^channel *=' rust-toolchain.toml | cut -d'"' -f2)
          echo "rust-version=$declared  channel=$pinned"
          if [ "$declared" != "$pinned" ]; then
            echo "::error::rust-version ($declared) and rust-toolchain.toml channel ($pinned) have drifted"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.floor.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # `cargo +<floor>` explicitly, not bare `cargo`: rust-toolchain.toml would
      # otherwise override whatever was installed and the job would test nothing.
      - run: cargo +${{ steps.floor.outputs.version }} check --workspace --all-targets --all-features --locked

  licenses:
    name: cargo-deny licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Every dependency's license is one deny.toml allows.
      - run: cargo deny --locked check licenses

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit
