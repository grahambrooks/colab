# npm and PyPI packages of a release: `npx colab-codemod`, `uvx colab-codemod`.
#
# Not part of release-kit (release.yml and scripts/release.py are shared,
# byte-identical files): this runs after a release, so a failure here
# never holds back the GitHub release or the Homebrew formula.
#
#   1. builds static musl binaries for Linux (the release's glibc builds
#      need the runner's glibc, 2.39 on ubuntu-latest, which sandboxes and
#      older distributions lack),
#   2. repacks them, and the release's macOS archives, with
#      packaging/build.py,
#   3. installs every package on Linux and macOS and runs it,
#   4. publishes, only where enabled: npm when the repository variable
#      PUBLISH_NPM is `true` (secret NPM_TOKEN), PyPI when PUBLISH_PYPI is
#      `true` (trusted publishing: add this workflow as a publisher of
#      `colab-codemod` on PyPI). A version already published is skipped.
#
# Run it by hand (Actions → packages → Run workflow) to build and test the
# packages of any release tag without publishing, or with publish ticked.
name: packages

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v2026.11.3)
        required: true
      publish:
        description: Publish where PUBLISH_NPM / PUBLISH_PYPI allow
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A release run started by a tag push reports the tag as its branch.
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  musl:
    name: musl (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - name: The release is a tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (a release re-run by hand reports its branch); run this workflow by hand with the tag"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: sudo apt-get update -q && sudo apt-get install -qy musl-tools
      - run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}
      - name: Build
        run: |
          set -euo pipefail
          python3 scripts/release.py set-version "${TAG#v}"
          cargo build --release --locked -p colab-cli --target ${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/colab
          # Static: no interpreter, no glibc symbol versions.
          if file "$bin" | grep -q 'dynamically linked'; then
            file "$bin"; echo "::error::$bin is not static"; exit 1
          fi
          "$bin" --version
          mkdir -p dist
          tar -C "$(dirname "$bin")" -czf "dist/colab-${TAG}-${{ matrix.target }}.tar.gz" colab
      - uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.target }}
          path: dist/*.tar.gz

  package:
    needs: musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: musl-*
          path: dist
          merge-multiple: true
      - name: Release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p '*apple-darwin.tar.gz' -p SHA256SUMS
      - run: python3 packaging/build.py "$TAG" dist out
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out

  smoke:
    name: smoke (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: pip and uvx
        run: |
          set -euo pipefail
          python3 -m venv venv
          venv/bin/pip install -q --no-index --find-links out/pypi colab-codemod
          venv/bin/colab --version
          venv/bin/colab-codemod --version
          venv/bin/python -m colab_codemod list-languages > /dev/null
          echo 'def f(a: Optional[int]): pass' |
            venv/bin/colab refactor -e "match python::pattern 'Optional[\$T]' { replace '\$T | None' }" --stdin --path x.py |
            grep -q 'int | None'
          uvx --no-index --find-links out/pypi colab-codemod --version
      - name: npm and npx
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) plat=linux-x64 ;; Linux-aarch64) plat=linux-arm64 ;;
            Darwin-arm64) plat=darwin-arm64 ;; Darwin-x86_64) plat=darwin-x64 ;;
          esac
          mkdir tgz
          (cd tgz && npm pack -q "../out/npm/colab-codemod-$plat" && npm pack -q ../out/npm/colab-codemod)
          mkdir app && cd app && npm init -y -q > /dev/null
          npm install -q --no-audit --no-fund ../tgz/*.tgz
          npx --no colab --version
          npx --no colab-codemod list-languages > /dev/null

  publish-npm:
    needs: smoke
    if: (github.event_name == 'workflow_run' || inputs.publish) && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish, platform packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in out/npm/colab-codemod-* out/npm/colab-codemod; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish --access public --provenance "$dir"
            fi
          done

  publish-pypi:
    needs: smoke
    if: (github.event_name == 'workflow_run' || inputs.publish) && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: out/pypi
          skip-existing: true
