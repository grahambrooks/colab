name: labeler

# Labels each pull request by the paths it touches (.github/labeler.yml).
# pull_request_target so it can label pull requests from forks; it only
# reads the labeler config from the base branch and never checks out or
# runs the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false
