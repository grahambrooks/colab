[package]
name = "colab-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The one place every colab language backend is registered. Composition root for the binary, and the same registry the test harnesses use."

[dependencies]
colab-core = { workspace = true }
colab-lang-c = { workspace = true }
colab-lang-cpp = { workspace = true }
colab-lang-csharp = { workspace = true }
colab-lang-go = { workspace = true }
colab-lang-java = { workspace = true }
colab-lang-js = { workspace = true }
colab-lang-json = { workspace = true }
colab-lang-kotlin = { workspace = true }
colab-lang-markdown = { workspace = true }
colab-lang-php = { workspace = true }
colab-lang-python = { workspace = true }
colab-lang-ruby = { workspace = true }
colab-lang-rust = { workspace = true }
colab-lang-swift = { workspace = true }
colab-lang-text = { workspace = true }
colab-lang-toml = { workspace = true }
colab-lang-ts = { workspace = true }
colab-lang-tsx = { workspace = true }

[dev-dependencies]
# The property suite (tests/properties.rs) walks the samples' own trees to
# choose nodes; the backends keep their grammars to themselves.
# tests/syntax_tree.rs checks colab's own tree against tree-sitter's;
# tests/properties.rs self-matches with the pattern compiler directly.
colab-syntax = { workspace = true, features = ["tree-sitter"] }
colab-rewrite = { workspace = true }
# tests/rust_parser.rs measures rust-analyzer's parser against tree-sitter.
colab-parse-rust = { workspace = true }
# tests/go_parser.rs holds colab's Go parser to tree-sitter-go's trees.
colab-parse-go = { workspace = true }
# tests/markdown_parser.rs holds colab's Markdown parser to what the
# backend read from tree-sitter-md.
colab-parse-markdown = { workspace = true }
tree-sitter-md = { workspace = true }
similar = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-kotlin-ng = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-typescript = { workspace = true }

[lints]
workspace = true
