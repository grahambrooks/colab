[package]
name = "colab-rewrite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tree-sitter rewriting primitives shared by every colab language backend: byte-range edits applied safely, whole-line deletion, tree traversal, and identifier rename."

[dependencies]
tree-sitter = { workspace = true }
colab-core = { workspace = true }
colab-syntax = { workspace = true, features = ["tree-sitter"] }
regex = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
# The parse cache's tests: it caches tree-sitter parses.
tree-sitter-go = { workspace = true }
tree-sitter-javascript = { workspace = true }
# The engine's own tests, on the parsers the backends use: Rust on
# rust-analyzer's, Go and Python on colab's.
colab-parse-rust = { workspace = true }
colab-parse-go = { workspace = true }
colab-parse-python = { workspace = true }

[lints]
workspace = true
