[package]
name = "colab-rewrite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rewriting primitives shared by every colab language backend, on colab's own syntax trees: the common floor (symbol, call, pattern), the pattern engine, byte-range edits applied safely, whole-line deletion."

[dependencies]
colab-core = { workspace = true }
colab-syntax = { workspace = true }
regex = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
# The engine's own tests, on the parsers the backends use: Rust on
# rust-analyzer's, Go and Python on colab's.
colab-parse-rust = { workspace = true }
colab-parse-go = { workspace = true }
colab-parse-python = { workspace = true }

[lints]
workspace = true
