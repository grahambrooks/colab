[workspace]
resolver = "3"
members = [
    "crates/colab-core",
    "crates/colab-dsl",
    "crates/colab-lang-c",
    "crates/colab-lang-cpp",
    "crates/colab-lang-csharp",
    "crates/colab-lang-go",
    "crates/colab-lang-java",
    "crates/colab-lang-js",
    "crates/colab-lang-json",
    "crates/colab-lang-kotlin",
    "crates/colab-lang-markdown",
    "crates/colab-lang-php",
    "crates/colab-lang-python",
    "crates/colab-lang-rust",
    "crates/colab-lang-swift",
    "crates/colab-lang-text",
    "crates/colab-lang-toml",
    "crates/colab-lang-ts",
    "crates/colab-lang-tsx",
    "crates/colab-backends",
    "crates/colab-rewrite",
    "crates/colab-syntax",
    "crates/colab-parse-rust",
    "crates/colab-parse-go",
    "crates/colab-parse-python",
    "crates/colab-parse-java",
    "crates/colab-parse-js",
    "crates/colab-parse-markdown",
    "crates/colab-lsp-client",
    "crates/colab-mcp",
    "crates/colab-cli",
]

[workspace.package]
version = "2026.11.24"
edition = "2024"
rust-version = "1.100.0"
authors = ["Graham Brooks"]
license = "MIT"
repository = "https://github.com/grahambrooks/colab"

[workspace.dependencies]
colab-backends = { path = "crates/colab-backends" }
colab-core = { path = "crates/colab-core" }
colab-dsl = { path = "crates/colab-dsl" }
colab-lang-c = { path = "crates/colab-lang-c" }
colab-lang-cpp = { path = "crates/colab-lang-cpp" }
colab-lang-csharp = { path = "crates/colab-lang-csharp" }
colab-lang-go = { path = "crates/colab-lang-go" }
colab-lang-java = { path = "crates/colab-lang-java" }
colab-lang-js = { path = "crates/colab-lang-js" }
colab-lang-json = { path = "crates/colab-lang-json" }
colab-lang-kotlin = { path = "crates/colab-lang-kotlin" }
colab-lang-markdown = { path = "crates/colab-lang-markdown" }
colab-lang-php = { path = "crates/colab-lang-php" }
colab-lang-python = { path = "crates/colab-lang-python" }
colab-lang-rust = { path = "crates/colab-lang-rust" }
colab-lang-swift = { path = "crates/colab-lang-swift" }
colab-lang-text = { path = "crates/colab-lang-text" }
colab-lang-toml = { path = "crates/colab-lang-toml" }
colab-lang-ts = { path = "crates/colab-lang-ts" }
colab-lang-tsx = { path = "crates/colab-lang-tsx" }
colab-mcp = { path = "crates/colab-mcp" }
colab-rewrite = { path = "crates/colab-rewrite" }
colab-syntax = { path = "crates/colab-syntax" }
colab-parse-rust = { path = "crates/colab-parse-rust" }
colab-parse-go = { path = "crates/colab-parse-go" }
colab-parse-python = { path = "crates/colab-parse-python" }
colab-parse-java = { path = "crates/colab-parse-java" }
colab-parse-js = { path = "crates/colab-parse-js" }
colab-parse-markdown = { path = "crates/colab-parse-markdown" }
colab-lsp-client = { path = "crates/colab-lsp-client" }

# Third-party deps shared across crates. Crates pick what they need.
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
regex = "1.13"
ignore = "0.4"
globset = "0.4"
rayon = "1.12"
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tree-sitter-md = "0.5.4"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.25.2"
tree-sitter-python = "0.25"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
toml_edit = "0.25"
log = "0.4"
env_logger = "0.11.12"
colored = "3.1.1"
lalrpop = "0.23.2"
lalrpop-util = { version = "0.23.2", features = ["lexer", "unicode"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
format_push_string = "warn"
cast_possible_truncation = "warn"

# What the release workflow ships (`profile: dist` in release.yml): one
# codegen unit and fat LTO make the binary ~16% smaller than `release`
# (33.0 MB vs 39.5 MB on aarch64-apple-darwin, 2026-11-15) for about three
# times the build. Local `--release` builds keep the faster defaults.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
