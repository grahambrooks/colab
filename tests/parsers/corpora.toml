# The wide corpora colab's parsers are measured on: each language's
# agreement with tree-sitter (a report, not a gate) and the clean files it
# reads with an error. `scripts/parser-corpora.py fetch` clones every repo
# at its commit into ~/.cache/colab-corpora/<lang>/<name>;
# `scripts/parser-corpora.py run <lang>` runs that language's comparison
# test over its corpus and prints the summary line.
#
# Recorded 2026-11-27 from the clones each language's parser was written
# against. Go, Python, JavaScript, TypeScript and Markdown were measured
# over a local workspace of private repositories (`local`), Rust over the
# Cargo registry; their numbers in docs/development-plan.md cannot be
# rerun by others.

[languages.c]
test = "cpp_parser"
env = "COLAB_C_FILES"
repos = [
    { name = "curl", url = "https://github.com/curl/curl.git", commit = "d5ec024cf205997c6a3416b2998953ce7cf23fcb" },
    { name = "git", url = "https://github.com/git/git.git", commit = "acba8bf9753134d9bde89f94369f775838a8c5fe" },
    { name = "lua", url = "https://github.com/lua/lua.git", commit = "c42d820bc0c3bc4f2ad536e19d2f05405af10387" },
    { name = "redis", url = "https://github.com/redis/redis.git", commit = "c92dcedc443f80d6e67173acdb06019aa8fee142" },
]

