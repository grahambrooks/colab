# Git hooks, run by prek.

[[repos]]
repo = "local"
hooks = [
  {
    id = "gitleaks",
    name = "gitleaks (staged secrets)",
    entry = "gitleaks git --pre-commit --redact --staged --verbose",
    language = "system",
    pass_filenames = false,
    stages = ["pre-commit"]
  },
  {
    id = "make-check",
    name = "make check",
    entry = "make check",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --all-targets -- -D warnings",
    language = "system",
    pass_filenames = false,
    files = "\\.rs$",
    stages = ["pre-push"]
  }
]
