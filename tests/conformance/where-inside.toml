feature = "Scoped with where inside"
description = "`where inside '<pattern>'` limits a rewrite to matches within a function, and `where not inside` to those outside it: `log` becomes `trace` in `a` and `info` everywhere else."

[[case]]
lang = "c"
script = """
match c::pattern 'log($A)' where inside 'void a(void) { $$$B }' { replace 'trace($A)' }
match c::pattern 'log($A)' where not inside 'void a(void) { $$$B }' { replace 'info($A)' }
"""
input = '''
void a(void) {
    log(1);
}

void b(void) {
    log(2);
}
'''
expected = '''
void a(void) {
    trace(1);
}

void b(void) {
    info(2);
}
'''

[[case]]
lang = "cpp"
script = """
match cpp::pattern 'log($A)' where inside 'namespace a { $$$B }' { replace 'trace($A)' }
match cpp::pattern 'log($A)' where not inside 'namespace a { $$$B }' { replace 'info($A)' }
"""
input = '''
namespace a {
int x = log(1);
}

namespace b {
int y = log(2);
}
'''
expected = '''
namespace a {
int x = trace(1);
}

namespace b {
int y = info(2);
}
'''

[[case]]
lang = "csharp"
script = """
match csharp::pattern 'Log($A)' where inside 'void A() { $$$B }' { replace 'Trace($A)' }
match csharp::pattern 'Log($A)' where not inside 'void A() { $$$B }' { replace 'Info($A)' }
"""
input = '''
class C {
    void A() {
        Log(1);
    }

    void B() {
        Log(2);
    }
}
'''
expected = '''
class C {
    void A() {
        Trace(1);
    }

    void B() {
        Info(2);
    }
}
'''

