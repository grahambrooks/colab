feature = "Held back by colab:ignore"
description = "A `colab:ignore` comment, on the line above a match or trailing it, keeps the rule off that line; the other matches change."

[[case]]
lang = "c"
script = "match c::pattern 'old($A)' { replace 'next($A)' }"
input = '''
void f(void) {
    old(1);
    // colab:ignore
    old(2);
    old(3); // colab:ignore
}
'''
expected = '''
void f(void) {
    next(1);
    // colab:ignore
    old(2);
    old(3); // colab:ignore
}
'''

