[[case]]
lang = "csharp"
script = "match csharp::pattern 'Old($A)' { replace 'Next($A)' }"
input = '''
class C {
    void F() {
        Old(1);
        // colab:ignore
        Old(2);
        Old(3); // colab:ignore
    }
}
'''
expected = '''
class C {
    void F() {
        Next(1);
        // colab:ignore
        Old(2);
        Old(3); // colab:ignore
    }
}
'''

