feature = "A statement deleted"
description = "`match <lang>::pattern 'debug($A)' { delete }`: a call that is a statement of its own goes, and its line with it."

[[case]]
lang = "c"
script = "match c::pattern 'debug($A)' { delete }"
input = '''
void f(void) {
    debug(1);
    run();
}
'''
expected = '''
void f(void) {
    run();
}
'''

[[case]]
lang = "cpp"
script = "match cpp::pattern 'debug($A)' { delete }"
input = '''
void f() {
    debug(1);
    run();
}
'''
expected = '''
void f() {
    run();
}
'''

[[case]]
lang = "csharp"
script = "match csharp::pattern 'Debug($A)' { delete }"
input = '''
class A {
    void F() {
        Debug(1);
        Run();
    }
}
'''
expected = '''
class A {
    void F() {
        Run();
    }
}
'''

[[case]]
lang = "go"
script = "match go::pattern 'debug($A)' { delete }"
input = '''
