feature = "A call replaced by name"
description = "`match <lang>::call \"old\" { replace_call \"next($args)\" }` rewrites each call of `old` with the template, `$args` its argument list; a mention that is not a call stays."

[[case]]
lang = "c"
script = 'match c::call "old" { replace_call "next($args)" }'
input = '''
void f(void) {
    old(1, 2);
    int (*p)(int, int) = old;
}
'''
expected = '''
void f(void) {
    next(1, 2);
    int (*p)(int, int) = old;
}
'''

[[case]]
lang = "cpp"
script = 'match cpp::call "old" { replace_call "next($args)" }'
input = '''
void f() {
    old(1, 2);
    auto p = old;
}
'''
expected = '''
void f() {
    next(1, 2);
    auto p = old;
}
'''

[[case]]
lang = "csharp"
script = 'match csharp::call "Old" { replace_call "Next($args)" }'
input = '''
class C {
    void F() {
        Old(1, 2);
        var p = (Action<int, int>)Old;
    }
}
'''
expected = '''
class C {
    void F() {
        Next(1, 2);
        var p = (Action<int, int>)Old;
    }
}
'''

[[case]]
lang = "go"
script = 'match go::call "old" { replace_call "next($args)" }'
input = '''
package p

func f() {
	old(1, 2)
	g := old
}
'''
expected = '''
package p

func f() {
	next(1, 2)
	g := old
}
'''

[[case]]
lang = "java"
script = 'match java::call "old" { replace_call "next($args)" }'
input = '''
class C {
    void f() {
        old(1, 2);
        Runnable r = this::old;
    }
}
'''
expected = '''
class C {
    void f() {
        next(1, 2);
        Runnable r = this::old;
    }
}
'''

