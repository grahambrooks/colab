@available(*, deprecated)
func old() {}
func keep() {}
'''
expected = '''
func keep() {}
'''

[[case]]
lang = "ts"
script = "match ts::pattern 'old(): void { $$$B }' { delete }"
input = '''
class C {
  /** Old docs. */
  @log
  old(): void {}
  keep(): void {}
}
'''
expected = '''
class C {
  keep(): void {}
}
'''

[[case]]
lang = "tsx"
script = "match tsx::pattern 'function old(): void { $$$B }' { delete }"
input = '''
