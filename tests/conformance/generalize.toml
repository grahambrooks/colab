feature = "Generalized from an edit"
description = "`colab.generalize` learns rules from one hand-made edit, `log(ctx, \"a\")` → `log(\"a\")`, and they make the same change at another call: the dropped and the carried argument become metavariables, the callee stays literal."

[[case]]
lang = "c"
before = 'log(ctx, "a")'
after = 'log("a")'
input = '''
void f(void) {
    log(other, "b");
}
'''
expected = '''
void f(void) {
    log("b");
}
'''

[[case]]
lang = "cpp"
before = 'log(ctx, "a")'
after = 'log("a")'
input = '''
void f() {
    log(other, "b");
}
'''
expected = '''
void f() {
    log("b");
}
'''

[[case]]
lang = "csharp"
before = 'Log(ctx, "a")'
after = 'Log("a")'
input = '''
class C {
    void F() {
        Log(other, "b");
    }
}
'''
expected = '''
class C {
    void F() {
        Log("b");
    }
}
'''

