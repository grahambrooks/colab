feature = "A binding tested with where matches"
description = "`where $A matches /tmp/` keeps only the matches whose binding's text the regex finds: `old(\"tmp\")` is rewritten, `old(\"keep\")` is not."

[[case]]
lang = "c"
script = "match c::pattern 'old($A)' where $A matches /tmp/ { replace 'next($A)' }"
input = '''
void f(void) {
    old("tmp");
    old("keep");
}
'''
expected = '''
void f(void) {
    next("tmp");
    old("keep");
}
'''

[[case]]
lang = "cpp"
script = "match cpp::pattern 'old($A)' where $A matches /tmp/ { replace 'next($A)' }"
input = '''
void f() {
    old("tmp");
    old("keep");
}
'''
expected = '''
void f() {
    next("tmp");
    old("keep");
}
'''

[[case]]
lang = "csharp"
script = "match csharp::pattern 'Old($A)' where $A matches /tmp/ { replace 'Next($A)' }"
input = '''
class C {
    void F() {
        Old("tmp");
        Old("keep");
    }
}
'''
expected = '''
class C {
    void F() {
        Next("tmp");
        Old("keep");
    }
}
'''

