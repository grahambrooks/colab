feature = "A lone body"
description = "A function pattern whose body is only `$$$B` matches a function of any body, and a rewrite keeps the body as it was."

[[case]]
lang = "c"
script = "match c::pattern 'void old(void) { $$$B }' { replace 'void next(void) { $$$B }' }"
input = '''
void old(void) {
    a();
    b();
}
'''
expected = '''
void next(void) {
    a();
    b();
}
'''

[[case]]
lang = "cpp"
script = "match cpp::pattern 'void old() { $$$B }' { replace 'void next() { $$$B }' }"
input = '''
void old() {
    a();
    b();
}
'''
expected = '''
void next() {
    a();
    b();
}
'''

[[case]]
lang = "csharp"
script = "match csharp::pattern 'void Old() { $$$B }' { replace 'void New() { $$$B }' }"
input = '''
class A {
    void Old() {
        X();
        Y();
    }
}
'''
expected = '''
class A {
    void New() {
        X();
        Y();
    }
}
'''

