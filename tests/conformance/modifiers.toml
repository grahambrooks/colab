feature = "Modifiers left out"
description = "An item pattern that spells no modifiers matches an item with any (`public`, `static`, `pub`, …), and a rewrite keeps them."

[[case]]
lang = "c"
script = "match c::pattern 'void old(void) { $$$B }' { replace 'void next(void) { $$$B }' }"
input = '''
static void old(void) {
    a();
}
'''
expected = '''
static void next(void) {
    a();
}
'''

[[case]]
lang = "cpp"
script = "match cpp::pattern 'void old() { $$$B }' { replace 'void next() { $$$B }' }"
input = '''
static void old() {
    a();
}
'''
expected = '''
static void next() {
    a();
}
'''

[[case]]
lang = "csharp"
script = "match csharp::pattern 'void Old() { $$$B }' { replace 'void New() { $$$B }' }"
input = '''
class A {
    public static void Old() {
        X();
    }
}
'''
expected = '''
class A {
    public static void New() {
        X();
    }
}
'''

[[case]]
lang = "go"
na = "Go has no item modifiers: visibility is the name's first letter."

[[case]]
lang = "java"
script = "match java::pattern 'void old() { $$$B }' { replace 'void next() { $$$B }' }"
input = '''
class A {
    public static void old() {
        a();
    }
}
'''
expected = '''
class A {
    public static void next() {
        a();
    }
}
'''

