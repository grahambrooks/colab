feature = "A call rewritten"
description = "`old($A, $B)` → `new($B, $A)`: a pattern binds a call's arguments, and the template moves them."

[[case]]
lang = "c"
script = "match c::pattern 'old($A, $B)' { replace 'new($B, $A)' }"
input = '''
void f(void) {
    old(1, 2);
}
'''
expected = '''
void f(void) {
    new(2, 1);
}
'''

[[case]]
lang = "cpp"
script = "match cpp::pattern 'old($A, $B)' { replace 'next($B, $A)' }"
input = '''
void f() {
    old(1, 2);
}
'''
expected = '''
void f() {
    next(2, 1);
}
'''

[[case]]
lang = "csharp"
script = "match csharp::pattern 'Old($A, $B)' { replace 'New($B, $A)' }"
input = '''
class A {
    void F() {
        Old(1, 2);
    }
}
'''
expected = '''
class A {
    void F() {
        New(2, 1);
    }
}
'''

