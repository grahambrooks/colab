    total += 1;
    puts("count");
}
'''

[[case]]
lang = "csharp"
script = 'match csharp::symbol "count" { replace "total" }'
input = '''
class C {
    int count = 0;
    // count stays
    void F() {
        count += 1;
        Log("count");
    }
}
'''
expected = '''
class C {
    int total = 0;
    // count stays
    void F() {
        total += 1;
        Log("count");
    }
}
'''

