feature = "A symbol renamed"
description = "`match <lang>::symbol \"count\" { replace \"total\" }` renames every identifier `count` and leaves the word in comments and strings alone."

[[case]]
lang = "c"
script = 'match c::symbol "count" { replace "total" }'
input = '''
int count = 0;
// count stays
void f(void) {
    count += 1;
    puts("count");
}
'''
expected = '''
int total = 0;
// count stays
void f(void) {
    total += 1;
    puts("count");
}
'''

[[case]]
lang = "cpp"
script = 'match cpp::symbol "count" { replace "total" }'
input = '''
int count = 0;
// count stays
void f() {
    count += 1;
    puts("count");
}
'''
expected = '''
int total = 0;
// count stays
